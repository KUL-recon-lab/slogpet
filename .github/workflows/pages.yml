# Build the browser frontend and publish it to GitHub Pages.
#
# The page is one self-contained HTML file with the slogpet sources embedded in
# it, so there is nothing to compile and nothing to serve dynamically: the build
# is `python web/build.py` and the deploy is a static upload.  The `web`
# environment deliberately contains Python and nothing else -- no numpy, no
# scipy, no pyodide.  Pyodide is fetched by the visitor's browser from a CDN.
#
# Enable this once under Settings -> Pages -> Source: GitHub Actions.

name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "slogpet/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NB: pin bumped by hand; check for a newer tag when you touch this file.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: web
          locked: true
          cache: true

      - name: Build index.html
        run: pixi run -e web web

      - name: Collect the site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  ## web/index.html is generated but tracked, so that Pages has something to
  ## serve.  This is the check that the committed copy is not stale.  It is a
  ## separate job so that a stale copy does not block the deployment: the page
  ## that goes live is the one built above, not the committed one.
