# Build the JupyterLite site and publish it to GitHub Pages.
#
# The site is explore.py turned into a notebook by jupytext, plus a copy of the
# slogpet sources next to it, served by a static JupyterLite build.  Nothing is
# installed at run time: the reader's browser fetches Pyodide from a CDN, which
# loads numpy, scipy and matplotlib on import, and slogpet is imported from the
# sources sitting beside the notebook on the reader's drive.
#
# Replaces the earlier deployment of web/index.html, which is still in the
# repository but no longer published.
#
# Enable this once under Settings -> Pages -> Source: GitHub Actions.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "explore.py"
      - "plots.py"
      - "lite/**"
      - "slogpet/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NB: pin bumped by hand; check for a newer tag when you touch this file.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: lite
          locked: true
          cache: true

      - name: Build the JupyterLite site
        run: pixi run -e lite site

      # The notebook is generated, so a broken explore.py would otherwise only
      # show up in someone's browser.  Running it here is the cheap check.
      - name: The script itself must still run
        run: pixi run -e lite python explore.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          BOKEH_BROWSER: none        # write the HTML, do not try to open a tab

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lite/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
