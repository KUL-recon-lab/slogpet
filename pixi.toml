# Dependencies, per task.
#
# Four environments, because the things one does here need genuinely different
# tools:
#
#   default   numpy + scipy + pytest    the model and its test suite  (~2 s)
#   paper     + matplotlib              make_all.py, then latexmk
#   explore   + ipython and a window    the same figures, on screen
#   lite      + jupyterlite and jupytext  explore.py, runnable in a browser
#   web       python and nothing else   web/build.py
#
# Two of those are not what one would guess, and both were checked rather than
# assumed:
#
#   * TeX is needed to GENERATE the figures, not merely to typeset the document
#     afterwards.  matplotlib's pgf backend shells out to pdflatex to measure
#     text, loading scrextend, underscore, amsmath and graphicx as it goes.  With
#     pdflatex removed from PATH, `make_all.py --only profile` fails, while
#     Figure 1 (Agg backend), table.tex and the whole test suite still succeed.
#
#   * The web build needs NOTHING beyond the standard library: web/build.py
#     imports json, os and sys.  Pyodide is fetched by the browser from a CDN at
#     page load, so it is not a build-time dependency at all.  The `web`
#     environment sets no-default-feature, so it cannot even see numpy or scipy
#     -- which keeps that claim honest rather than merely stated.
#
# TeX itself is deliberately NOT a pixi dependency.  conda-forge's texlive-core
# ships the binaries and nothing else: an 8 MB texmf tree with zero .sty files,
# so it can typeset neither this document nor matplotlib's measurement run, and
# conda-forge has no package that supplies the missing styles.  So TeX comes from
# the system:
#
#     Debian/Ubuntu   apt-get install -y --no-install-recommends \
#                       texlive-base texlive-latex-base texlive-latex-recommended \
#                       texlive-pictures latexmk
#     macOS           MacTeX, or BasicTeX plus
#                       tlmgr install latexmk pgfplots subcaption caption \
#                                     mathtools koma-script underscore
#
# `pixi run check-tex` reports whether the toolchain is complete before you
# discover it isn't halfway through a build.

[workspace]
name = "slogpet"
version = "0.1.0"
description = "SLoG detectability of cylindrical PET systems"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

# ---------------------------------------------------------------- the model
[dependencies]
python = ">=3.9"
numpy = ">=1.22"
scipy = ">=1.8"

# ---------------------------------------------------------------- the tests
[feature.test.dependencies]
pytest = ">=7"

[feature.test.tasks]
test = { cmd = "pytest", description = "the fast suite (~2 s)" }
test-all = { cmd = "pytest -m ''", description = "also Monte Carlo and Eq. (53)" }

# ------------------------------------------------- the figures and the paper
[feature.paper.dependencies]
matplotlib-base = ">=3.5"

# Figure 1 is a PDF, and PDFs carry a creation date, which would make the file
# differ on every run and the check-figures gate below fail every time.
# matplotlib honours SOURCE_DATE_EPOCH, so fixing it makes the output
# byte-reproducible.  The value is arbitrary and only has to stay constant.
[feature.paper.activation.env]
SOURCE_DATE_EPOCH = "1700000000"

[feature.paper.tasks]
figures = { cmd = "python make_all.py", description = "regenerate every figure and table" }
pdf = { cmd = "latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex", cwd = "manuscript", depends-on = [
  "figures",
], description = "build the manuscript" }
clean = { cmd = "latexmk -C main.tex", cwd = "manuscript", description = "remove LaTeX build products" }
# The generated figures are tracked, so that a clone can build the paper with
# LaTeX alone.  This is the check that they have not gone stale.
check-figures = { cmd = "git diff --exit-code --stat -- manuscript", depends-on = [
  "figures",
], description = "fail if the committed figures are out of date" }
check-tex = { cmd = "kpsewhich amsmath.sty amssymb.sty booktabs.sty caption.sty geometry.sty graphicx.sty hyperref.sty mathtools.sty pgfplots.sty rotating.sty scrextend.sty subcaption.sty tikz.sty underscore.sty > /dev/null && latexmk -version", description = "is the system TeX complete?" }

# --------------------------------------------------- the figures, on screen
#
# Same figures, drawn in a window instead of into the document: every make()
# takes path=None.  matplotlib-base has no GUI toolkit, so this environment asks
# for the full matplotlib, which brings a Qt backend with it, and for ipython to
# drive it from.
[feature.explore.dependencies]
matplotlib = ">=3.5"
ipython = ">=8"
bokeh = ">=3.4"           # explore.py plots with bokeh, not matplotlib
pandas = ">=1.5"          # the systems table, and bokeh needs it in practice

[feature.explore.tasks]
ipython = { cmd = "ipython --matplotlib", description = "a prompt with the figures importable: from paper.fig_beds import make; make(None)" }
show = { cmd = "python make_all.py --show", description = "draw every figure on screen, writing nothing" }

# ------------------------------------------- explore.py, in a reader's browser
#
# JupyterLite turns explore.py into a notebook and serves it as a static site:
# the reader runs the real package in their own browser, with nothing installed
# and nothing sent anywhere.  See lite/build.py for how the pieces fit.
[feature.lite.dependencies]
jupyterlite-core = ">=0.6"
jupyterlite-pyodide-kernel = "*"
jupyter_server = "*"          # jupyter lite build needs it to index the contents;
                              # conda-forge spells it with an underscore
jupytext = ">=1.16"           # explore.py -> explore.ipynb
bokeh = ">=3.4"               # so that this environment can also run explore.py
pandas = ">=1.5"              # the systems table in explore.py

[feature.lite.tasks]
site = { cmd = "python lite/build.py", description = "build the JupyterLite site into lite/site" }
serve = { cmd = "python lite/build.py --serve", description = "build it and serve it at localhost:8009" }

# ------------------------------------------------------------- the web page
[feature.web.dependencies]
python = ">=3.9"          # and nothing else: build.py imports json, os, sys

[feature.web.tasks]
web = { cmd = "python web/build.py", description = "regenerate web/index.html" }
check-web = { cmd = "git diff --exit-code --stat -- web/index.html", depends-on = [
  "web",
], description = "fail if index.html is out of date" }

[feature.webcheck.dependencies]
playwright = "*"

[environments]
default = ["test"]
paper = ["paper"]
explore = ["paper", "explore"]
lite = ["lite"]
web = { features = ["web"], no-default-feature = true }
webcheck = ["web", "webcheck"]
